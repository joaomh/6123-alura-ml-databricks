# databricks.yml
# nome do pipeline que estamos criando
bundle:
  name: pipeline_mlops_ingestao

sync:
  exclude:
    - "aula_2/**"       # Ignora tudo dentro da pasta aula_2
    - "aula_3/**"     
    - "aula_4/**"  
    - "aula_5/**"  
# ================================
# iremos definir os 3 ambientes, dev, stage e prod
variables:
  env_catalog:
    description: "O Catálogo (Catalog) alvo no Unity Catalog"
    default: "dev"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-0b9b6719-6175.cloud.databricks.com
    variables:
      env_catalog: "dev"

  stag:
    workspace:
      host: https://dbc-0b9b6719-6175.cloud.databricks.com
    variables:
      env_catalog: "stag"

  prod:
    workspace:
      host: https://dbc-0b9b6719-6175.cloud.databricks.com
    variables:
      env_catalog: "prod"

# O Job de teste que será criado com o objetivo de criar os ambientes
resources:
  jobs:
    job_teste_catalog:
      name: "${bundle.target}_job_teste_criar_env"
            
      tasks:
        - task_key: "criar_catalogos_dev_prod"
          notebook_task:
            notebook_path: "./aula_6/ingestao.py"
            base_parameters:
              env_catalog: "${var.env_catalog}"
